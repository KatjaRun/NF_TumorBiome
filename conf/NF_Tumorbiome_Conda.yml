name: NF_Tumorbiome
channels:
  - bioconda
  - conda-forge
dependencies:
  # Core languages
  - python=3.10
  - r-base=4.3

  # Metagenomic tools
  - centrifuge
  - kraken2
  - recentrifuge=1.14.1

  # Python libraries
  - ete4
  - pandas=1.5.3
  - biopython=1.79

  # Base R packages
  - r-magrittr
  - r-tibble
  - r-dplyr
  - r-ggpubr
  - r-ggtext
  - r-box
  - r-openxlsx
  - bioconductor-gsva

  # Plot packages
  - r-pals
  - r-colorramps
  - r-ggplot2
  - r-igraph
  - bioconductor-complexheatmap

  # Microbiome packages
  - bioconductor-phyloseq
  - bioconductor-decontam
  - bioconductor-microbiome
  - r-spieceasi

  # Helpers for compatibility / optional development
  - r-remotes
  - r-devtools

